apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: storage
  namespace: argocd

spec:
  project: default

  sources:
    # OpenEBS itself
    - repoURL: https://openebs.github.io/openebs
      chart: openebs
      targetRevision: "4.5.1"

      helm:
        releaseName: openebs
        valueFiles:
          - $values/infrastructure/storage/openebs-values.yaml

    # Our Murim-specific configuration + Helm values
    - repoURL: https://github.com/HermannMarinho/homelab-k8s.git
      targetRevision: main
      ref: values
      path: infrastructure/storage

  destination:
    server: https://kubernetes.default.svc
    namespace: openebs

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true