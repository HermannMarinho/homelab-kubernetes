apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: external-dns
  namespace: argocd

  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      targetRevision: "1.21.1"

      helm:
        releaseName: external-dns

        valueFiles:
          - $values/infrastructure/dns/external-dns/values.yaml

    - repoURL: https://github.com/HermannMarinho/homelab-k8s.git
      targetRevision: main
      ref: values
      path: infrastructure/dns/external-dns

  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true