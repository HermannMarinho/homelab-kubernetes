apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: certificates
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "10"

  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: https://github.com/HermannMarinho/homelab-k8s.git
    targetRevision: main
    path: infrastructure/certificates/config

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true