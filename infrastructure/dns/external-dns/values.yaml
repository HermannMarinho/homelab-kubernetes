provider:
  name: rfc2136

sources:
  - gateway-httproute

policy: upsert-only

registry: txt

txtOwnerId: murim

domainFilters:
  - home.example.com

gatewayNamespace: gateway

triggerLoopOnEvent: true

extraArgs:
  - --gateway-name=homelab
  - --rfc2136-host=192.0.2.53
  - --rfc2136-port=53
  - --rfc2136-zone=home.example.com
  - --rfc2136-tsig-secret-alg=hmac-sha256
  - --rfc2136-tsig-axfr

env:
  - name: EXTERNAL_DNS_RFC2136_TSIG_KEYNAME
    valueFrom:
      secretKeyRef:
        name: rfc2136-tsig
        key: rfc2136-tsig-keyname

  - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
    valueFrom:
      secretKeyRef:
        name: rfc2136-tsig
        key: rfc2136-tsig-secret

resources:
  requests:
    cpu: 20m
    memory: 64Mi

  limits:
    memory: 128Mi