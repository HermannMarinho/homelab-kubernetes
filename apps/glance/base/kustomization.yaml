apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: glance-config
    files:
      - config/glance.yml
      - config/home.yml

  - name: glance-assets
    files:
      - assets/user.css

labels:
  - pairs:
      app.kubernetes.io/name: glance
      app.kubernetes.io/managed-by: argocd